name: platemate-integration
include:
  - path: ./backend/mvp/compose.yaml
    env_file: ./backend/mvp/.env
services:
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10

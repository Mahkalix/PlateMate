name: Matching API
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: platemate
          POSTGRES_PASSWORD: platemate
          POSTGRES_DB: platemate_test
        ports: ['5433:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend/mvp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/mvp/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage
      - name: Vérifier la pile Docker du backend par HTTP
        run: |
          export JWT_SECRET="$(openssl rand -hex 32)"
          export MVP_DB_PASSWORD="$(openssl rand -hex 32)"
          export NODE_ENV=test
          export AUTH0_ISSUER_BASE_URL=http://127.0.0.1:49080/
          export AUTH0_CLIENT_ID=test-web AUTH0_CLIENT_SECRET=test-client-secret
          export AUTH0_CALLBACK_URL=http://localhost:3001/auth/callback
          export COMPOSE_FILE=compose.yaml:compose.smoke.yaml
          trap 'docker compose down --volumes' EXIT
          docker compose up -d --build --wait --wait-timeout 120 api
          curl --fail --silent http://127.0.0.1:3001/health
          docker compose run --rm --build smoke

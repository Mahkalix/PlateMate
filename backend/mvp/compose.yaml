name: platemate-matching
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: platemate
      POSTGRES_DB: platemate
      POSTGRES_PASSWORD: ${MVP_DB_PASSWORD:?Définir MVP_DB_PASSWORD en hexadécimal}
    volumes:
      - data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "platemate", "-d", "platemate"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: .
    environment:
      DATABASE_URL: postgres://platemate:${MVP_DB_PASSWORD}@db:5432/platemate
      JWT_SECRET: ${JWT_SECRET:?Définir JWT_SECRET avec au moins 32 octets}
      NODE_ENV: ${NODE_ENV:-development}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_CONNECT_WEBHOOK_SECRET: ${STRIPE_CONNECT_WEBHOOK_SECRET:-}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
      PORT: 3001
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${MVP_API_PORT:-3001}:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  data:

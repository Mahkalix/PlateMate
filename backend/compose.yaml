services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: platemate
      POSTGRES_PASSWORD: platemate
      POSTGRES_DB: platemate
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - platemate_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platemate -d platemate"]
      interval: 5s
      timeout: 3s
      retries: 10

  db-test:
    profiles: [test]
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: platemate
      POSTGRES_PASSWORD: platemate
      POSTGRES_DB: platemate_test
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platemate -d platemate_test"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  platemate_pgdata:

name: platemate-integration-tests
services:
  test-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: platemate
      POSTGRES_PASSWORD: platemate
      POSTGRES_DB: platemate_test
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platemate -d platemate_test"]
      interval: 3s
      timeout: 3s
      retries: 20
